name: MCP Release

# 仅在推送 mcp-v* 标签时触发（与整仓发布 release.yml 的 v* 互不干扰）
on:
  push:
    tags:
      - "mcp-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 同步 寻源内核 进 tar（npm 包同理，否则 start/answer/refine_sourcing 三工具降级）
        run: |
          rm -rf mcp/寻源内核
          cp -r skills/寻源内核 mcp/寻源内核
          rm -rf mcp/寻源内核/__pycache__

      - name: 打包 MCP（仅 mcp/ 目录，保持干净分发）
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -czf "beacon-mfg-mcp-${tag}.tar.gz" \
            -C mcp server.py bin README.md RELEASE.md package.json 寻源内核
          ls -lh "beacon-mfg-mcp-${tag}.tar.gz"

      - name: 创建 GitHub Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Beacon-MFG 只读 MCP 服务 ${tag}" \
            --notes-file mcp/RELEASE.md \
            "beacon-mfg-mcp-${tag}.tar.gz"
