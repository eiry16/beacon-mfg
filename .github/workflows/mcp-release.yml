name: MCP Release

# 仅在推送 mcp-v* 标签时触发（与整仓发布 release.yml 的 v* 互不干扰）
on:
  push:
    tags:
      - "mcp-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 目录名 2026 年已从 skills/寻源内核 改为 skills/rfq-kernel（与 npm 包的
      # copy-rfk.js 保持一致）。workflow 里残留旧名，v1.7.0 首次触发时直接
      # `cp: cannot stat 'skills/寻源内核'` 失败，Release 建不出来 —— 已改。
      - name: 同步寻源内核进 tar（npm 包同理，否则 start/answer/refine_sourcing 三工具降级）
        run: |
          rm -rf mcp/rfq-kernel
          cp -r skills/rfq-kernel mcp/rfq-kernel
          rm -rf mcp/rfq-kernel/__pycache__

      - name: 打包 MCP（仅 mcp/ 目录，保持干净分发）
        # ⚠ 清单必须与 mcp/package.json 的 files 保持一致（2026-10-30）：
        #   · vid_token.py 缺失 → server.py 的 try/except 静默降级成「不改写 id」，
        #     对外回内部编号（CN-MFG-0000163），既可枚举、又与 /v1/rec 的 token 口径不符；
        #   · selfupdate.py 缺失 → bin/selfupdate.js 找不到脚本，自更新静默失效。
        #   两者都不会报错，只会「功能少一点」，所以只能靠清单自检兜住。
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -czf "beacon-mfg-mcp-${tag}.tar.gz" \
            -C mcp server.py identity.py vid_token.py selfupdate.py \
            http_server.py mcp_adapter.py \
            bin README.md package.json rfq-kernel
          ls -lh "beacon-mfg-mcp-${tag}.tar.gz"

      - name: 创建 GitHub Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Beacon-MFG 只读 MCP 服务 ${tag}" \
            --generate-notes \
            "beacon-mfg-mcp-${tag}.tar.gz"
