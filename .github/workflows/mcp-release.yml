name: MCP Release

# 触发：mcp-v* 标签（npm publish → GitHub Release → 注册到官方 MCP Registry）；
#       手动 dispatch（只跑 Registry 注册，用于补发/重试；此时 release 被 skip）。
# 与整仓发布 release.yml 的 v* 互不干扰。
on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

jobs:
  release:
    # 仅真实 tag 推送才打 Release（dispatch 时 ref 是分支名，跳过）
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 目录名 2026 年已从 skills/寻源内核 改为 skills/rfq-kernel（与 npm 包的
      # copy-rfk.js 保持一致）。workflow 里残留旧名，v1.7.0 首次触发时直接
      # `cp: cannot stat 'skills/寻源内核'` 失败，Release 建不出来 —— 已改。
      - name: 同步寻源内核进 tar（npm 包同理，否则 start/answer/refine_sourcing 三工具降级）
        run: |
          rm -rf mcp/rfq-kernel
          cp -r skills/rfq-kernel mcp/rfq-kernel
          rm -rf mcp/rfq-kernel/__pycache__

      - name: 打包 MCP（仅 mcp/ 目录，保持干净分发）
        # ⚠ 清单必须与 mcp/package.json 的 files 保持一致（2026-10-30）：
        #   · vid_token.py 缺失 → server.py 的 try/except 静默降级成「不改写 id」，
        #     对外回内部编号（CN-MFG-0000163），既可枚举、又与 /v1/rec 的 token 口径不符；
        #   · selfupdate.py 缺失 → bin/selfupdate.js 找不到脚本，自更新静默失效。
        #   两者都不会报错，只会「功能少一点」，所以只能靠清单自检兜住。
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -czf "beacon-mfg-mcp-${tag}.tar.gz" \
            -C mcp server.py identity.py vid_token.py selfupdate.py \
            http_server.py mcp_adapter.py \
            bin README.md package.json rfq-kernel
          ls -lh "beacon-mfg-mcp-${tag}.tar.gz"

      - name: 发布到 npm（package.json 的 prepack 会经 copy-rfk.js 同步寻源内核）
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitHub Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Beacon-MFG 只读 MCP 服务 ${tag}" \
            --generate-notes \
            "beacon-mfg-mcp-${tag}.tar.gz"

  # ─────────────────────────────────────────────────────────────────────────────
  # 官方 MCP Registry 注册（2026-11-10 起随每个 mcp-v* 版本自动发布）。
  # 认证走 GitHub OIDC：Actions 在 eiry16 名下运行 ⇒ 天然证明 io.github.eiry16
  # 命名空间归属，不需要 device-code 登录（本机直连 github.com/login/device/code
  # 间歇被断，已弃用该路径）。
  # 前置：npm 包内必须有 mcpName（package.json，2026-11-10 加）；
  #       server.json 的 version 必须与 npm 已发布版本一致，否则 400/422
  #       （npm publish 已前置进 release job，此 job 依赖其完成并等 npm 传播）。
  # ─────────────────────────────────────────────────────────────────────────────
  publish-registry:
    needs: release
    # dispatch 补发/重试时 release 是 skipped，仍要允许本 job 跑
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC 认证必需
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v4

      # Registry 会实时校验 npm 上该版本是否已存在；npm publish 完成后
      # 传播有延迟（几十秒内），不等待就会 404 → publish 失败
      # （1.12.0/1.12.1 首跑各吃过一次这个亏）。
      - name: 等待 npm 版本传播
        run: |
          set -euo pipefail
          ver="$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['version'])")"
          for i in $(seq 1 30); do
            if curl -fsSL "https://registry.npmjs.org/beacon-mfg-mcp" | grep -q "\"${ver}\""; then
              echo "npm ${ver} visible (check ${i})"; exit 0
            fi
            echo "waiting for npm ${ver} (${i}/30)..."; sleep 10
          done
          echo "npm ${ver} not visible after 5min"; exit 1
        working-directory: mcp

      - name: 安装 cosign 并校验 mcp-publisher 签名（官方推荐做法）
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: 下载 mcp-publisher（固定版本 + 签名校验，不用可变的 latest）
        run: |
          set -euo pipefail
          os="linux"; arch="amd64"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: 登录 MCP Registry（OIDC）
        run: ./mcp-publisher login github-oidc

      - name: 发布 server.json 到 MCP Registry
        # 二进制解在仓库根，publish 要切进 mcp/（server.json 所在），用相对路径调用
        run: ../mcp-publisher publish
        working-directory: mcp
