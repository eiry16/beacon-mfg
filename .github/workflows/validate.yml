name: data-validate
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/validate.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验数据格式与必填字段
        run: python scripts/validate.py
